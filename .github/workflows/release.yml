name: Release

# Push a tag like v1.2.0 to publish a signed APK on the Releases page.
# The annotated tag's message becomes the release notes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Make sure the annotated tag (and its message) is present, not a lightweight copy.
      - name: Fetch tag
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android platform 37
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RETRO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The RETRO_KEYSTORE_BASE64 secret is not set, so the APK can't be signed."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          RETRO_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          RETRO_KEYSTORE_PASSWORD: ${{ secrets.RETRO_KEYSTORE_PASSWORD }}
          RETRO_KEY_ALIAS: ${{ secrets.RETRO_KEY_ALIAS }}
          RETRO_KEY_PASSWORD: ${{ secrets.RETRO_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Check signature
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk RetroPlayer.apk

      # Always named RetroPlayer.apk, so .../releases/latest/download/RetroPlayer.apk
      # is a permanent one-click link to the newest version.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" RetroPlayer.apk \
            --title "RetroPlayer ${GITHUB_REF_NAME#v}" \
            --notes-from-tag \
            --latest
