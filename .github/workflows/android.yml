name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Gradle 9.6 / AGP 9.5 run on Java 17+; 21 matches a current LTS.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The runner's SDK does not ship platform 37; install it (accepts licences).
      - uses: android-actions/setup-android@v3
      - run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RetroPlayer-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
